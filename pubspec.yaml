name: widget_rebuilds_inspector
description: "Debug-only Flutter overlay that counts widget rebuilds, flashes their bounds, and compares frequency before and after a change."
version: 1.0.1
repository: https://github.com/Hamad-Anwar/widget_rebuilds_inspector
topics:
  - debugging
  - performance
  - devtools

screenshots:
  - description: 'Widget Rebuilds Inspector overlay and rebuild counts'
    path: screenshots/screenshot.png

environment:
  sdk: ^3.10.1
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
